# Alternate theme config for `website_hexo_theme`.
# Hexo deep-merges this over themes/website_hexo_theme/_config.yml, so the
# theme submodule stays untouched. Keys here win.

# Extra top-bar menu entries (merged with the theme's built-in menu).
menu:
  "What is?":
    url: /what-is-displayhive/
    icon: fas fa-circle-info
  Docs:
    url: https://docs.displayhive.org/
    icon: fas fa-book

# Hide the "recommended posts" card on the homepage (the white bar).
recommend:
  enable: false

# Default image for Open Graph / Twitter social cards (used when a page has no
# own thumbnail). Falls back to the theme logo if unset.
og_image: /medias/cover.jpg
